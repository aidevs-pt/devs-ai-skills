name: Build local release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: python scripts/build_manifest.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_examples.py
      - run: node --test cli/test/cli.test.mjs tests/test_finder_runtime.mjs
      - run: python scripts/package.py --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devs-ai-skills
          path: dist/
